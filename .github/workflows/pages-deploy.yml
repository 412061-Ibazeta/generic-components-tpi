name: Deploy Angular PWA to GitHub Pages

on:
  push:
    branches: [ deploy ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Read Angular default project
        run: echo "NG_PROJECT=$(node -p "require('./angular.json').defaultProject")" >> $GITHUB_ENV

      - name: Build Angular (prod)
        run: |
          echo "Building project: $NG_PROJECT"
          npx ng build $NG_PROJECT --configuration production --base-href "/generic-components-tpi/"

      - name: Detect output dir & add SPA fallback
        run: |
          OUTDIR=$(ls -d dist/*/browser 2>/dev/null || true)
          if [ -z "$OUTDIR" ]; then OUTDIR="dist"; fi
          echo "OUTDIR=$OUTDIR" >> $GITHUB_ENV
          cp "$OUTDIR/index.html" "$OUTDIR/404.html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.OUTDIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
